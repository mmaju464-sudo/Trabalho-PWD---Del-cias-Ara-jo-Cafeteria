{% extends 'base.html' %}

{% block conteudo %}

<h1>Meu Perfil 👤</h1>

<div class="perfil-card">

    <!-- FOTO DE PERFIL -->
    <div style="text-align: center; margin-bottom: 25px;">

        {% if usuario.foto %}

            <img
                src="{{ url_for('static', filename=usuario.foto) }}"
                alt="Foto de perfil"
                style="
                    width: 150px;
                    height: 150px;
                    object-fit: cover;
                    border-radius: 50%;
                    border: 4px solid #ddd;
                "
            >

        {% else %}

            <div
                style="
                    width: 150px;
                    height: 150px;
                    margin: auto;
                    border-radius: 50%;
                    background: #eee;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 60px;
                "
            >
                👤
            </div>

        {% endif %}

    </div>


    <!-- FORMULÁRIO DO PERFIL -->
    <form
        method="POST"
        action="{{ url_for('atualizar_perfil') }}"
        enctype="multipart/form-data"
    >

        <div class="perfil-item">

            <span>Nome</span>

            <input
                type="text"
                name="nome"
                value="{{ usuario.nome }}"
                required
            >

        </div>


        <div class="perfil-item">

            <span>E-mail</span>

            <strong>
                {{ usuario.email }}
            </strong>

        </div>


        <div class="perfil-item">

            <span>Foto de perfil</span>

            <input
                type="file"
                name="foto"
                accept="image/png,image/jpeg,image/webp"
            >

        </div>


        <button
            type="submit"
            class="btn"
        >
            💾 Salvar alterações
        </button>

    </form>


    <br>


    <a
        href="/meus_pedidos"
        class="btn"
    >
        📦 Ver meus pedidos
    </a>

</div>

{% endblock %}
