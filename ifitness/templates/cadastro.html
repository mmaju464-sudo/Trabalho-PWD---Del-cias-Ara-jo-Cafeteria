{% extends 'base.html' %}

{% block conteudo %}

<div class="form-container">

    <h1>Crie sua conta</h1>

    {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
    {% endif %}

    <form method="POST" action="{{url_for('salvar_usuario') }}">

        <div class="form-group">
            <label>Nome</label>
            <input
                type="text"
                name="nome"
                placeholder="Digite seu nome"
                required
            >
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input
                type="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input
                type="password"
                name="senha"
                placeholder="Crie uma senha"
                required
            >
        </div>

        <button type="submit">
            Criar conta
        </button>

    </form>

    <p class="texto-centro">
        Já possui uma conta?
        <a href="/login">Entrar</a>
    </p>

</div>

{% endblock %}
